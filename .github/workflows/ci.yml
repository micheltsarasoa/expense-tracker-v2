name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Static: Lint + Type-check + Secret Scanning ──────────────────────────
  static:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No local-only files tracked
        run: test -z "$(git ls-files .claude/settings.local.json '**/.vercel/**' '.env' '**/.env.local')"

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Git hooks run on a clean checkout (portability) ─────────────────────────
  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pre-commit hook
        run: sh .husky/pre-commit

      - name: commit-msg hook accepts a conventional message
        run: |
          echo "chore: ci hook check" > "$RUNNER_TEMP/msg"
          sh .husky/commit-msg "$RUNNER_TEMP/msg"

      - name: commit-msg hook rejects a non-conventional message
        run: |
          echo "not conventional" > "$RUNNER_TEMP/bad"
          ! sh .husky/commit-msg "$RUNNER_TEMP/bad"

  # ── 2. Logic: Unit tests ─────────────────────────────────────────────────────
  logic:
    name: Logic
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest)
        run: pnpm test -- --reporter=verbose --reporter=github-actions
