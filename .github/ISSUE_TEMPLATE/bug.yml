name: Bug report
description: Something does not work as documented.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Use the terms of GLOSSARY.md. Never paste real amounts, emails or data of a child.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in as a parent\n2. Open Budgets\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [Solo user, Parent, Co-parent, Child, Roommate, Not profile-specific]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.0 or abc1234
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker compose, From source, Development]
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: 'This is not a security issue (report those privately: Security tab, Report a vulnerability).'
          required: true
